<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="lens-l" x1="10%" y1="5%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#26263a" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#0c0c18" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#16162a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="lens-r" x1="90%" y1="5%" x2="20%" y2="90%">
      <stop offset="0%"   stop-color="#26263a" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#0c0c18" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#16162a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="shine-l" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="30%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine-r" x1="100%" y1="0%" x2="30%" y2="70%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="30%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#404040"/>
      <stop offset="20%"  stop-color="#181818"/>
      <stop offset="65%"  stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#282828"/>
    </linearGradient>
    <mask id="m">
      <rect width="800" height="280" fill="white"/>
      <path d="M134,130 Q134,68 200,64 Q266,68 266,130 Q266,192 200,196 Q134,192 134,130 Z" fill="black"/>
      <path d="M534,130 Q534,68 600,64 Q666,68 666,130 Q666,192 600,196 Q534,192 534,130 Z" fill="black"/>
    </mask>
  </defs>
  <!-- Lens fills with gradient -->
  <path d="M118,130 Q118,50 200,46 Q282,50 282,130 Q282,210 200,214 Q118,210 118,130 Z" fill="url(#lens-l)"/>
  <path d="M518,130 Q518,50 600,46 Q682,50 682,130 Q682,210 600,214 Q518,210 518,130 Z" fill="url(#lens-r)"/>
  <!-- Shine/reflection overlay -->
  <path d="M118,130 Q118,50 200,46 Q282,50 282,130 Q282,210 200,214 Q118,210 118,130 Z" fill="url(#shine-l)"/>
  <path d="M518,130 Q518,50 600,46 Q682,50 682,130 Q682,210 600,214 Q518,210 518,130 Z" fill="url(#shine-r)"/>
  <!-- Frame rim -->
  <g mask="url(#m)">
    <path d="M118,130 Q118,50 200,46 Q282,50 282,130 Q282,210 200,214 Q118,210 118,130 Z" fill="url(#frm)"/>
    <path d="M518,130 Q518,50 600,46 Q682,50 682,130 Q682,210 600,214 Q518,210 518,130 Z" fill="url(#frm)"/>
    <path d="M282,118 Q340,108 400,112 Q460,108 518,118 L518,130 Q460,124 400,128 Q340,124 282,130 Z" fill="url(#frm)"/>
    <path d="M120,112 L34,104 Q26,103 25,112 Q25,122 34,123 L119,130 Z" fill="url(#frm)"/>
    <path d="M680,112 L766,104 Q774,103 775,112 Q775,122 766,123 L681,130 Z" fill="url(#frm)"/>
    <rect x="112" y="106" width="14" height="22" rx="2" fill="url(#frm)"/>
    <rect x="674" y="106" width="14" height="22" rx="2" fill="url(#frm)"/>
  </g>
  <!-- Top edge highlight -->
</svg>
