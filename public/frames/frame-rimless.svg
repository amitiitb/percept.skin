<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <!-- Rimless: just the outline, very thin frame, temples -->
  <!-- Left lens outline -->
  <rect x="132" y="82" width="152" height="106" rx="8" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Right lens outline -->
  <rect x="516" y="82" width="152" height="106" rx="8" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Bridge bar (thin metal) -->
  <line x1="284" y1="120" x2="516" y2="120" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="320" cy="136" rx="5" ry="9" fill="#444"/>
  <ellipse cx="480" cy="136" rx="5" ry="9" fill="#444"/>
  <!-- Left temple (thin) -->
  <path d="M132,106 L34,98 Q26,97 25,106 Q25,116 34,117 L131,120" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Right temple (thin) -->
  <path d="M668,106 L766,98 Q774,97 775,106 Q775,116 766,117 L669,120" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- Corner screws -->
  <circle cx="136" cy="86" r="4" fill="#555"/>
  <circle cx="280" cy="86" r="4" fill="#555"/>
  <circle cx="520" cy="86" r="4" fill="#555"/>
  <circle cx="664" cy="86" r="4" fill="#555"/>
</svg>
