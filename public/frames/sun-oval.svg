<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <linearGradient id="lens-l" x1="10%" y1="5%" x2="80%" y2="90%">
      <stop offset="0%"   stop-color="#26263a" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#0c0c18" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#16162a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="lens-r" x1="90%" y1="5%" x2="20%" y2="90%">
      <stop offset="0%"   stop-color="#26263a" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#0c0c18" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#16162a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="shine-l" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="30%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine-r" x1="100%" y1="0%" x2="30%" y2="70%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="30%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#404040"/>
      <stop offset="20%"  stop-color="#181818"/>
      <stop offset="65%"  stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#282828"/>
    </linearGradient>
    <mask id="m">
      <rect width="800" height="280" fill="white"/>
      <path d="M126,130 Q126,78 200,72 Q274,78 274,130 Q274,182 200,188 Q126,182 126,130 Z" fill="black"/>
      <path d="M526,130 Q526,78 600,72 Q674,78 674,130 Q674,182 600,188 Q526,182 526,130 Z" fill="black"/>
    </mask>
  </defs>
  <!-- Lens fills with gradient -->
  <path d="M108,130 Q108,62 200,56 Q292,62 292,130 Q292,198 200,204 Q108,198 108,130 Z" fill="url(#lens-l)"/>
  <path d="M508,130 Q508,62 600,56 Q692,62 692,130 Q692,198 600,204 Q508,198 508,130 Z" fill="url(#lens-r)"/>
  <!-- Shine/reflection overlay -->
  <path d="M108,130 Q108,62 200,56 Q292,62 292,130 Q292,198 200,204 Q108,198 108,130 Z" fill="url(#shine-l)"/>
  <path d="M508,130 Q508,62 600,56 Q692,62 692,130 Q692,198 600,204 Q508,198 508,130 Z" fill="url(#shine-r)"/>
  <!-- Frame rim -->
  <g mask="url(#m)">
    <path d="M108,130 Q108,62 200,56 Q292,62 292,130 Q292,198 200,204 Q108,198 108,130 Z" fill="url(#frm)"/>
    <path d="M508,130 Q508,62 600,56 Q692,62 692,130 Q692,198 600,204 Q508,198 508,130 Z" fill="url(#frm)"/>
    <path d="M292,118 Q348,108 400,110 Q452,108 508,118 L508,132 Q452,122 400,124 Q348,122 292,132 Z" fill="url(#frm)"/>
    <path d="M110,112 L34,104 Q26,103 25,112 Q25,122 34,123 L109,126 Z" fill="url(#frm)"/>
    <path d="M690,112 L766,104 Q774,103 775,112 Q775,122 766,123 L691,126 Z" fill="url(#frm)"/>
    <rect x="102" y="105" width="14" height="22" rx="2" fill="url(#frm)"/>
    <rect x="684" y="105" width="14" height="22" rx="2" fill="url(#frm)"/>
  </g>
  <!-- Top edge highlight -->
</svg>
